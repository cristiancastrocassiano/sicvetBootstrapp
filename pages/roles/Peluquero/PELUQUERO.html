<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex min-vh-100">
    
    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="bg-white border-end d-flex flex-column justify-content-between p-3 flex-shrink-0" style="width: 260px;">
      <div>
        <div class="d-flex align-items-center gap-2 mb-4 pb-2 border-bottom">
          <div>
            <i class="bi bi-paw-fill fs-5"></i>
          </div>
          <div class="d-flex align-items-center gap-2 mb-4 pb-2 border-bottom">
            <div class=" rounded-3 d-flex align-items-center justify-content-center p-1 shadow-sm overflow-hidden" style="width: 40px; height: 40px;">
            <img src="/assets/dashboard/img/logo.png" alt="logo huella" class="img-fluid w-100 h-100 object-fit-contain">
            </div>
            <h2 class="fw-bold fs-6 m-0 lh-1">SICVET</h2>
            
            <small class="text-secondary" style="font-size: 0.75rem;">Gestión Veterinaria</small>
          </div>
        </div>

        <nav class="nav nav-pills flex-column">
          <a href="#" class="nav-link active bg-primary-subtle text-primary fw-semibold rounded-3 d-flex align-items-center gap-2 py-2 px-3">
            <i class="bi bi-calendar-event fs-5"></i>
            <span>Agenda</span>
          </a>
        </nav>
      </div>

      <div>
        <div class="d-flex flex-column gap-1 mb-3 pb-3 border-bottom">
          <a href="#" class="text-decoration-none text-secondary fw-semibold d-flex align-items-center gap-2 py-2 px-2 rounded-2">
            <i class="bi bi-person fs-5"></i>
            <span>Mi Perfil</span>
          </a>
          <a href="/Home.html" class="text-decoration-none text-danger fw-semibold d-flex align-items-center gap-2 py-2 px-2 rounded-2">
            <i class="bi bi-box-arrow-right fs-5"></i>
            
            <span>Cerrar Sesión</span>
          </a>
        </div>

        <div class="d-flex align-items-center gap-2 pt-1">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 38px; height: 38px;">
            MD
          </div>
          <div>
            <h2 class="fw-bold fs-6 m-0 lh-1">Marcos Delgado</h2>
            <small class="text-secondary" style="font-size: 0.75rem;">Peluquero</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1 p-4">
      
      <!-- Encabezado superior -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 fw-bold m-0">Gestión de Agenda</h1>
        
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light rounded-circle p-2 border-0 shadow-sm text-secondary">
            <i class="bi bi-bell fs-5"></i>
          </button>
          <div class="d-flex align-items-center gap-2">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px;">
              MD
            </div>
            <div class="lh-1">
              <span class="fw-bold d-block small">Marcos</span>
              <small class="text-secondary" style="font-size: 0.75rem;">Peluquero</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Tarjetas de Estadísticas (KPIs) -->
      <div class="row g-3 mb-4">
        <!-- Pendientes -->
        <div class="col-md-4">
          <div class="bg-primary-subtle text-primary rounded-4 p-3 text-center border-0">
            <span class="fs-2 fw-bold d-block">1</span>
            <span class="small fw-semibold">Pendientes</span>
          </div>
        </div>
        <!-- Completadas -->
        <div class="col-md-4">
          <div class="bg-success-subtle text-success rounded-4 p-3 text-center border-0">
            <span class="fs-2 fw-bold d-block">0</span>
            <span class="small fw-semibold">Completadas</span>
          </div>
        </div>
        <!-- No Asistió -->
        <div class="col-md-4">
          <div class="bg-danger-subtle text-danger rounded-4 p-3 text-center border-0">
            <span class="fs-2 fw-bold d-block">0</span>
            <span class="small fw-semibold">No Asistió</span>
          </div>
        </div>
      </div>

      <!-- Filtros Hoy / Historial -->
      <div class="mb-4">
        <div class="btn-group bg-white p-1 rounded-3 shadow-sm border" role="group">
          <button type="button" class="btn btn-light fw-bold px-4 rounded-2 py-1 shadow-sm">Hoy</button>
          <button type="button" class="btn btn-white text-secondary fw-semibold px-4 rounded-2 py-1 border-0">Historial</button>
        </div>
      </div>

      <!-- Tarjeta de Cita Registrada -->
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="d-flex justify-content-between align-items-start mb-3">
          
          <!-- Hora y Detalles del Cliente/Mascota -->
          <div class="d-flex gap-4">
            <div class="text-center">
              <span class="fw-bold text-primary fs-5 d-block">11:00</span>
              <small class="text-secondary" style="font-size: 0.75rem;">2025-07-01</small>
            </div>
            <div>
              <h2 class="h5 fw-bold m-0">Rocky</h2>
              <p class="text-secondary mb-1 small">Carlos Rodríguez · Peluquería</p>
              <span class="badge bg-light text-secondary border fw-normal">Perro</span>
            </div>
          </div>

          <!-- Estado -->
          <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-4 fw-semibold">Pendiente</span>
        </div>

        <!-- Botones de Acción -->
        <div class="row g-2 mt-2">
          <div class="col-6">
            <button class="btn btn-success w-100 py-2 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-check-circle"></i> Atendido
            </button>
          </div>
          <div class="col-6">
            <button class="btn bg-danger-subtle text-danger border-0 w-100 py-2 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-x-circle"></i> No Asistió
            </button>
          </div>
        </div>
      </div>

    </main>

  </div>
    
    
</body>
</html>
